# MGLRU (the kernel's multi-generation LRU, build-boot.sh): pages used in the
# last second are never evicted. When they cannot all stay in RAM, the kernel
# kills an app (the one ztMETRO has least recently shown, by its
# oom_score_adj) instead of thrashing zram with the screen frozen for minutes.
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
