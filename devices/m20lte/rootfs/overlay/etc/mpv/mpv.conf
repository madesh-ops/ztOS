# The Galaxy M20's video decoder: the MFC (s5p-mfc, /dev/video0) decodes H.264,
# HEVC and VP9 bit-identical to software at about a fifth of the CPU. -copy:
# frames come back to memory, so every video output works. Codecs the MFC does
# not have (AV1...) fall back to software by themselves. Tube asks for the
# same (apps/tube/player.py).
hwdec=v4l2m2m-copy
vd-lavc-o=num_capture_buffers=32
