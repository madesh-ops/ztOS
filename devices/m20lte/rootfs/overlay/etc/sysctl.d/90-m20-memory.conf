# Swap is zram (zrn-zram.service): reading a page back is a decompression,
# far cheaper than dropping file cache and reading it from eMMC again, so
# swap readily (the kernel allows up to 200), and one page at a time
# (read-ahead is for disks).
vm.swappiness = 150
vm.page-cluster = 0
# kswapd starts sooner (1 % of RAM above the minimum instead of 0.1 %), so an
# app being opened finds free pages instead of reclaiming them itself, which
# was the stutter while switching apps; and no extra reclaim bursts when
# memory is merely fragmented (zram does not need them).
vm.watermark_scale_factor = 100
vm.watermark_boost_factor = 0
