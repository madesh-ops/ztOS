# The M20's Wi-Fi (Samsung's SCSC driver, devices/m20lte/drivers/scsc-wlan)
# makes two interfaces: wlan0 for stations and p2p0 for Wi-Fi Direct. The
# driver refuses to connect on p2p0 ("Connect requested on incorrect vif"),
# so NetworkManager must only use wlan0. "+=" adds to the list in
# 10-zboot.conf (usb0) instead of replacing it.
[keyfile]
unmanaged-devices+=interface-name:p2p0
