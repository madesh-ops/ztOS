# The M20's speaker (ABOX, devices/m20lte/drivers/abox). ABOX fetches a whole
# period from the ring as soon as a stream starts: started with less than a
# period written, the stream underruns at once, and again after every
# recovery (PipeWire, which starts with only its quantum written, then never
# played). Period interrupts and a period of headroom keep more than that
# written; 8 periods leave room for clients asking for larger blocks.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.period-size = 1024
        api.alsa.period-num = 8
        api.alsa.headroom = 1024
      }
    }
  }
]
