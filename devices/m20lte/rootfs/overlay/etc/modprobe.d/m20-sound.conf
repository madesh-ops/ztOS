# ABOX, the audio DSP (devices/m20lte/drivers/abox): register it and let a
# stream that opens start its firmware (/lib/firmware/exynos7885-abox/,
# calliope_sram.bin and calliope_dram.bin from the VENDOR partition's
# firmware/). It loads from the device tree; the card and the TFA9896
# amplifier follow.
options exynos7885_abox_rproc enable=1 allow_firmware_start=1
