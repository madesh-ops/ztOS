# The motion hold (the shell's "motion MS") on the M20: the GPU at its top
# step. Upstream's 455 MHz suits the S9's Mali-G72 MP18; this Mali-G71 MP2
# held at 450 MHz took 7-19 ms a frame and the shell's animations fell to
# 30 fps. At 845 MHz they hold 16.9 ms (2026-11-24, ft.sh A/B).
[Service]
Environment=ZRNPERFD_MOTION_GPU_HZ=845000000
