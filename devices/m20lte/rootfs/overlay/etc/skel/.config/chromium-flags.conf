# Internet through the computer the phone is plugged into (usb-internet.sh):
# Chromium does not take socks5h:// from all_proxy, so it is told directly.
--proxy-server=socks5://127.0.0.1:1080
# Look like Chrome on an Android phone, so sites serve their mobile layouts
--user-agent="Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Mobile Safari/537.36"
