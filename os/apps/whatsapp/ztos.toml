[app]
id = "com.zerone.whatsapp"
name = "WhatsApp"
caps = "WHATSAPP"
version = "0.3.0"
entry = "main.py"
icon = "icon.svg"
description = "WhatsApp text messaging for ztOS"
requires = ["qt6-imageformats"]   # (stickers are WebP)
performance = "eco"

[build]
# native/whatsapp-native: built by native/build.sh (Go, whatsmeow)
include = ["**/*.py", "**/*.svg", "native/whatsapp-native"]
