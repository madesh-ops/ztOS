<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
 <alias><family>sans-serif</family><prefer><family>Segoe UI</family><family>Noto Color Emoji</family></prefer></alias>
 <alias><family>system-ui</family><prefer><family>Segoe UI</family></prefer></alias>
 <alias binding="strong"><family>Segoe WP</family><prefer><family>Segoe UI</family></prefer></alias>
 <alias binding="strong"><family>Segoe WP Light</family><prefer><family>Segoe UI Light</family></prefer></alias>
 <alias binding="strong"><family>Segoe WP Semilight</family><prefer><family>Segoe UI Semilight</family></prefer></alias>
 <alias binding="strong"><family>Segoe WP Semibold</family><prefer><family>Segoe UI Semibold</family></prefer></alias>
 <!-- Segoe UI Symbol (the Windows Phone glyphs) where it is installed; Segoe MDL2
      Assets, which ztOS ships, has the same icons at the same codepoints -->
 <alias binding="same"><family>Segoe UI Symbol</family><accept><family>Segoe MDL2 Assets</family></accept></alias>
</fontconfig>
